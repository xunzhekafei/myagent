- id: mild_not_harsh
  group: behavior
  title: 温和档不应咄咄逼人
  role: AI/ML Engineer
  pressure: 温和
  background: 刚转行，经验有限
  messages:
    - role: assistant
      text: 先请你做一个自我介绍，重点讲讲你做过的项目和最擅长的方向。
    - role: user
      text: 我做过一个推荐系统的小项目，不过很多细节记得不太清楚了。
  expect:
    should:
      - 用更温和的方式换个问法——问一个更宽泛、更容易回答的问题也算，
        不要求必须说「没关系」或给出提示；或者给一点方向性提示
    should_not:
      - 连续逼问同一个细节
      - 使用压力档的话术（如「你这句话没有信息量」）
  checks:
    one_question: true
    no_praise: true
    forbid: ["请继续"]
