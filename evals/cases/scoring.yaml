# 评分质量评测用例
#
# 这一组会真的跑完整报告流程（解析 → 逐题评分 → 汇总），
# 每题 1-2 分钟，默认不执行。用 --group scoring 显式开启。
#
# 目的是回答两个问题：
#   1. 分数有没有区分度（好的该高、空的该低、错的该扣）
#   2. 证据是不是真的引用了候选人的原话

- id: score_excellent
  group: scoring
  title: 回答扎实且有数据，总分应偏高
  role: AI 应用开发
  transcript: |
    面试官：你那个检索增强系统，召回和重排是怎么做的？
    候选人：召回用 Milvus 的 HNSW。选它是因为数据量在千万级，IVF 要先训练聚类、对分布漂移敏感，HNSW 支持增量插入更稳；代价是内存占用高，我们单机 64G 能扛住。ef 设 64 是试出来的：从 32 提到 64，Recall@20 从 0.82 升到 0.94，P99 只涨了 12 毫秒；再提到 128 收益就很小了。先取 top-100，再用 bge-reranker 精排，最后取前 20。重排选 bge 而不是通用 cross-encoder，是因为它对中文效果好、延迟也可控。
    面试官：效果指标是怎么定义的？
    候选人：回答质量看离线标注集的 answer accuracy，1200 条人工标注，两个人独立标、分歧由第三人仲裁，kappa 0.81，分数从 0.71 提到 0.86；线上看用户采纳率（点了引用来源的比例）和追问率。延迟看同一个监控面板 7 天滑动窗口的 P99，从 420 毫秒降到 180 毫秒。中间出过一次问题：重排模型升级后 top-k 没同步调，延迟涨回去了，后来把重排输入条数做成配置项并加了告警。检索和重排这两块是我负责的，索引参数和重排模型都是我调的。
  assertions:
    # 门槛定 7.0 而不是更高：这段对话只有 2 轮，深度分拿 6.0 是合理的，
    # 7.5 会让一个本就不该满分的回答永远不达标。
    min_overall: 7.0
    evidence_from_transcript: true

- id: score_empty
  group: scoring
  title: 通篇空话，总分应偏低
  role: AI/ML Engineer
  transcript: |
    面试官：先做一个自我介绍，重点讲讲你做过的项目。
    候选人：我做过很多项目，主要是我负责的，用了很多先进的技术，效果挺好的，业务方也比较满意。技术上用了深度学习、大模型这些，具体细节记不太清了，反正最后顺利上线了。
    面试官：那你最擅长什么方向？
    候选人：我比较全面的，前后端都能做，算法也懂一些，看公司需要。
  assertions:
    max_overall: 5.5

- id: score_factual_error
  group: scoring
  title: 概念说错应在技术正确性上扣分
  role: AI/ML Engineer
  transcript: |
    面试官：AUC 是怎么算的，它衡量什么？
    候选人：AUC 就是准确率的一种叫法，算的是预测对的比例。AUC 是 0.9 就说明模型准确率是 90%，比 0.8 的模型好。
    面试官：类别不平衡时为什么不用准确率？
    候选人：可以用准确率啊，正样本少的话就多训练几次，把正样本复制几遍就行，不影响模型输出概率。
  assertions:
    max_dimension:
      技术正确性: 6

- id: score_evidence_quoted
  group: scoring
  title: 报告必须引用候选人原话作为证据
  role: 前端工程师
  transcript: |
    面试官：说一下浏览器的重排和重绘，什么操作会触发？
    候选人：改几何属性比如宽高会触发重排，改颜色只触发重绘。我们项目里滚动列表用 transform 做动画，避免改 top 引起重排，还把频繁的 DOM 操作合并到 requestAnimationFrame 里。
    面试官：怎么验证优化有效？
    候选人：用 Chrome Performance 面板录制，看 FPS 和 long task 数量，优化前滚动时 long task 有 20 多个，优化后基本没有了，FPS 从 30 左右稳定到 55 以上。
  assertions:
    evidence_from_transcript: true
